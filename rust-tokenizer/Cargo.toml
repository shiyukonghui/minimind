[package]
name = "rust-tokenizer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
critical-section = { version = "1", features = ["std"] }
env_logger = "0.11.10"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wordchipper = "=0.9.1"
wordchipper-training = "=0.9.1"
